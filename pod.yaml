apiVersion: v1
kind: Service
metadata:
    name: Loadbalancer-svc
spec:
    type: LoadBalancer
    selector:
       app: hello
    ports:
      - name: http
        protocol : TCP
        port : 80

apiVersion : app/v1
kind: Deployment
metadata:
    name: Loadbalancer-pod
spec:
   replicas: 3
   selector:
      matchlabels:
         app: hello
   template:
      metadata:
         labels:
            app: hello
      spec:
         containers:
           - name : hello
             image: tamildockhub/images1:latest
             imagepullpolicy: Always     



